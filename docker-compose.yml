# Orion AI — stack isolado em containers.
# NÃO usa a porta 11434 do Ollama já rodando no host (produção legada).
# Ollama deste stack: host 11435 → container 11434, volume próprio.

services:
  ollama-orion:
    image: ollama/ollama:latest
    container_name: orion-ollama
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-8}"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_THREADS: "${OLLAMA_NUM_THREADS:-8}"
    volumes:
      - ollama_orion_data:/root/.ollama
      - ./deploy/modelfile:/modelfile:ro
    ports:
      - "${OLLAMA_ORION_HOST_PORT:-11435}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  orion-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
    container_name: orion-app
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      PORT: "3000"
      OLLAMA_URL: http://ollama-orion:11434
      OLLAMA_USE_MODELFILE: "${OLLAMA_USE_MODELFILE:-1}"
      OLLAMA_BASE_MODEL: "${OLLAMA_BASE_MODEL:-llama3.2:3b}"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-orion-ai}
      OLLAMA_PLAN_MODEL: ${OLLAMA_PLAN_MODEL:-llama3.2:3b}
      OLLAMA_APP_MAX_CONCURRENT: ${OLLAMA_APP_MAX_CONCURRENT:-4}
      OLLAMA_QUEUE_MAX_WAIT_MS: ${OLLAMA_QUEUE_MAX_WAIT_MS:-45000}
    ports:
      - "${ORION_APP_HOST_PORT:-3001}:3000"
    volumes:
      # Scripts no host (git pull) — load test sem rebuild só do .mjs
      - ./scripts:/app/scripts:ro
    depends_on:
      ollama-orion:
        condition: service_healthy

volumes:
  ollama_orion_data:
